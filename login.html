<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentBridge | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top left, #0d1117, #010409); color: #e1e7ef; }
        .glass { background: rgba(18, 24, 38, 0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="glass p-10 rounded-3xl w-full max-w-md shadow-2xl animate-in zoom-in-95 duration-500">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold outfit mb-2">Welcome Back</h1>
            <p class="text-gray-400">Login to your company's compliance dashboard</p>
        </div>
        
        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Work Email</label>
                <input id="email" type="email" required placeholder="admin@company.com" class="w-full bg-[#161b22] border border-gray-800 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                <input id="password" type="password" required placeholder="••••••••" class="w-full bg-[#161b22] border border-gray-800 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div id="error-msg" class="text-red-400 text-sm hidden"></div>

            <button type="submit" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold shadow-lg shadow-blue-600/30 transition-all transform hover:scale-101 active:scale-98">Login to Platform</button>
        </form>

        <p class="mt-8 text-center text-sm text-gray-500">
            Don't have an account? <a href="signup.html" class="text-blue-400 hover:underline">Register your company</a>
        </p>
    </div>

    <script>
        document.getElementById("login-form").addEventListener("submit", async(e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorMsg = document.getElementById("error-msg");
            errorMsg.classList.add("hidden");

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem("token", data.access_token);
                    localStorage.setItem("org_id", data.org_id);
                    window.location.href = "dashboard.html";
                } else {
                    errorMsg.innerText = data.detail || "Login failed";
                    errorMsg.classList.remove("hidden");
                }
            } catch (err) {
                errorMsg.innerText = "Connection error. Is backend running?";
                errorMsg.classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
