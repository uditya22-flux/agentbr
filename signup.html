<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentBridge | Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at bottom right, #0d1117, #010409); color: #e1e7ef; }
        .glass { background: rgba(18, 24, 38, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen py-10">
    <div class="glass p-10 rounded-3xl w-full max-w-lg shadow-2xl animate-in fade-in duration-500 transform scale-100 slide-in-from-bottom-4">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold outfit mb-2">Register Company</h1>
            <p class="text-gray-400">Join the B2B SaaS platform for RBI AI compliance</p>
        </div>
        
        <form id="signup-form" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Company Name</label>
                    <input id="company-name" required placeholder="FinTech Corp" class="w-full bg-[#161b22] border border-gray-800 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Industry</label>
                    <select id="industry" class="w-full bg-[#161b22] border border-gray-800 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="fintech">FinTech</option>
                        <option value="bank">Bank</option>
                        <option value="NBFC">NBFC</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Admin Work Email</label>
                <input id="email" type="email" required placeholder="admin@company.com" class="w-full bg-[#161b22] border border-gray-800 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Platform Password</label>
                <input id="password" type="password" required placeholder="••••••••" class="w-full bg-[#161b22] border border-gray-800 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div id="error-msg" class="text-red-400 text-sm hidden"></div>
            <div id="success-msg" class="text-green-400 text-sm hidden">Registration successful! Redirecting to login...</div>

            <button type="submit" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-semibold shadow-lg shadow-emerald-600/20 transition-all transform hover:scale-101 active:scale-98">Create Organization Account</button>
        </form>

        <p class="mt-8 text-center text-sm text-gray-500">
            Already have an account? <a href="login.html" class="text-blue-400 hover:underline">Log in</a>
        </p>
    </div>

    <script>
        document.getElementById("signup-form").addEventListener("submit", async(e) => {
            e.preventDefault();
            const data = {
                company_name: document.getElementById("company-name").value,
                admin_email: document.getElementById("email").value,
                password: document.getElementById("password").value,
                industry: document.getElementById("industry").value
            };
            const errorMsg = document.getElementById("error-msg");
            const successMsg = document.getElementById("success-msg");
            
            errorMsg.classList.add("hidden");
            successMsg.classList.add("hidden");

            try {
                const res = await fetch("/api/auth/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                
                const result = await res.json();
                if (res.ok) {
                    successMsg.classList.remove("hidden");
                    setTimeout(() => window.location.href = "login.html", 1500);
                } else {
                    errorMsg.innerText = result.detail || "Signup failed";
                    errorMsg.classList.remove("hidden");
                }
            } catch (err) {
                errorMsg.innerText = "Connection error. Is backend running?";
                errorMsg.classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
